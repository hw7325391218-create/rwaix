name: vc-interop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  w3c-vc-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vc-interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc-interop-report
          path: reports/vc-interop
          if-no-files-found: error
